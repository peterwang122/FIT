services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fitroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stock_info}
      MYSQL_USER: ${MYSQL_USER:-fit}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fitpass}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  flower:
    image: mher/flower:2.0.1
    restart: unless-stopped
    command: ["celery", "--broker=redis://redis:6379/0", "flower", "--port=5555"]
    depends_on:
      - redis
    ports:
      - "127.0.0.1:5555:5555"

volumes:
  mysql_data:
  redis_data:
